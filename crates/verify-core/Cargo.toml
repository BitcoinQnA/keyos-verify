[package]
name = "verify-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
pgp = { version = "0.20", default-features = false }
rsa = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rand = "0.8"
sha2 = "0.10"
smallvec = "1"
